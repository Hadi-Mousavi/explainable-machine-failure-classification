[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai4i-pm"
version = "0.1.0"
description = "Reproducible Day 1 foundations for synthetic observation-level failure classification"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
dependencies = [
  "pandas>=2.2,<3",
  "numpy>=2,<3",
  "scikit-learn>=1.5,<2",
  "matplotlib>=3.9,<4",
  "seaborn>=0.13,<0.14",
]

[project.scripts]
ai4i-pm = "ai4i_pm.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.9,<1"]
notebook = ["nbclient>=0.10,<1", "nbformat>=5.10,<6", "ipykernel>=6,<8"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai4i_pm"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
