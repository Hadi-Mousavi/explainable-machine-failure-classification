# Prespecified before Day 4 fitting. All observations come from the approved training export.
publication_base = "eca2f5e855750d8473e827de3396b711e2f55d6c"
primary_model = "hist_gradient_boosting-10"
secondary_model = "random_forest-11"
reference = "A0"
metric = "average_precision_score"
positive_class = 1
sd_ddof = 1
a0_absolute_tolerance = 1e-12
native_threads = 1
analysis = "Give the five folds equal weight. Subtract the same model's A0 AP on the same fold. Report mean difference, individual differences and their signs. Compare directions across families. Interpret A5 as a combined sensitivity condition. Keep the provisional Day 3 selection."
temperature_difference_K = "Process temperature [K] - Air temperature [K]"
mechanical_power_W = "Torque [Nm] * Rotational speed [rpm] * (2*pi/60)"

