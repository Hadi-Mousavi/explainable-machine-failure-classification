eval_ends = [3600, 4800, 6000]
ordering = "Ascending numeric UDI, zero-based half-open row slices. Fit [0,fit_end), evaluate [fit_end,eval_end). Retain observed order and class composition."
diagnostics = "Record actual positive and negative counts in every fit and evaluation slice. Do not stratify, skip or redraw an evaluation block."

