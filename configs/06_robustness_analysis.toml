# Prespecified before the first Phase 06 fit. Paths refer to the migrated repository.
baseline_commit = "4debe0c69bc020206aa2f0e10591f6a1e7ce6048"
partition = "train"
rows = 6000
positives = 203
source_sha256 = "dc6630cd9b1f0f853922fad78a1b6436570d3f1ec863f1dd5c4340ac56bc8a8e"
parameters = "Use every classifier_parameters entry and the ordered A0/A4 columns from the hash-pinned Phase 04 design. Cross-check both models against the Phase 03 specifications."
estimator_seed = 42
native_threads = 1
execution = "Serial CPU fits, RF n_jobs=1. Measure elapsed fit plus scoring seconds per new evaluation. Historical reference fit times unavailable."
primary_metric = "Average precision from continuous class-1 scores; constant-score baseline equals evaluation prevalence."
aggregation = "Equal-weight arithmetic mean per model and seed or ordered strategy; sample SD (ddof=1) and min/max across folds or blocks. Range of seed means includes 42. Compare ordered means with the equal-weight mean of all three seed means. Rank unrounded means descending, equal scores share rank. Pair A4 minus A0 within each family and identical memberships."
undefined = "Mark AP undefined for zero evaluation positives or a single-class fit. Retain counts, memberships and reason. An all-positive evaluation has AP 1. With any undefined AP, leave the affected aggregate and comparisons undefined."
replay_atol = 1e-12
limitations = "Overlapping resamples, selection on the original folds and synthetic label rules limit inference. UDI supplies neither a verified timestamp nor equipment identity. Fit size, prevalence and evaluated rows differ between strategies. No independence, significance, causal, forecasting or field-transfer claims."

[models]
M1 = ["hist_gradient_boosting-10", "A0"]
M2 = ["random_forest-11", "A0"]
M3 = ["hist_gradient_boosting-10", "A4"]
M4 = ["random_forest-11", "A4"]

[random_cv]
reference_seed = 42
seeds = [7, 123]
folds = 5
shuffle = true
ordering = "Ascending numeric UDI; shuffled StratifiedKFold, shared across all configurations. Fit on complement of each saved evaluation UDI list."
fit_rows = 4800
eval_rows = 1200
sorted_eval_positives = [40, 40, 41, 41, 41]
